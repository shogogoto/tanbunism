name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      neo4j:
        image: neo4j:latest
        env:
          NEO4J_AUTH: neo4j/passwordneo
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p passwordneo 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Poetry cache depends on OS, Python version and Poetry version.
      - name: Cache Poetry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-cache-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Cache Packages
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-local-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}-${{ hashFiles('.github/workflows/*.yml') }}
      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.4.1
          poetry install
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Test
        run: poetry run pytest -q -x --tb=short
        env:
          NEO4J_URL: bolt://neo4j:passwordneo@localhost:7687

      - name: Run linter
        run: poetry run task lint
